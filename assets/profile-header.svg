<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Harshil Bhuva — Security, Systems, Research</title>
  <desc id="desc">Animated dark cyber grid with a terminal panel, scanning line, and pulsing network signal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset=".62" stop-color="#0B1224"/>
      <stop offset="1" stop-color="#071B24"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F5D4" stop-opacity=".1"/>
      <stop offset=".5" stop-color="#00F5D4"/>
      <stop offset="1" stop-color="#7CFF6B" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F5D4" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00F5D4" stop-opacity=".8"/>
      <stop offset="1" stop-color="#7CFF6B" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#38BDF8" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <clipPath id="panel-clip"><rect x="52" y="64" width="720" height="158" rx="12"/></clipPath>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <path d="M0 248H1200" stroke="url(#edge)" stroke-width="2">
    <animate attributeName="stroke-opacity" values=".45;1;.45" dur="3.6s" repeatCount="indefinite"/>
  </path>
  <path d="M30 28H240L260 48H420" fill="none" stroke="#00F5D4" stroke-opacity=".4" stroke-width="1.5"/>
  <path d="M880 28H1040L1060 48H1170" fill="none" stroke="#7CFF6B" stroke-opacity=".4" stroke-width="1.5"/>
  <circle cx="1110" cy="90" r="48" fill="none" stroke="#00F5D4" stroke-opacity=".18"/>
  <circle cx="1110" cy="90" r="32" fill="none" stroke="#7CFF6B" stroke-opacity=".25">
    <animate attributeName="r" values="28;38;28" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values=".15;.6;.15" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1110" cy="90" r="5" fill="#00F5D4">
    <animate attributeName="r" values="4;7;4" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <path d="M1062 90H1015L995 110H950" fill="none" stroke="#00F5D4" stroke-opacity=".5" stroke-width="1.5"/>
  <rect x="52" y="64" width="720" height="158" rx="12" fill="#050816" stroke="#164E63" stroke-width="1.5"/>
  <path d="M52 100H772" stroke="#164E63" stroke-width="1"/>
  <circle cx="76" cy="82" r="5" fill="#FB7185"/>
  <circle cx="94" cy="82" r="5" fill="#FBBF24"/>
  <circle cx="112" cy="82" r="5" fill="#7CFF6B"/>
  <text x="136" y="87" fill="#64748B" font-family="monospace" font-size="12" letter-spacing="2">PROFILE / PUBLIC</text>
  <text x="82" y="145" fill="#E2E8F0" font-family="monospace" font-size="34" font-weight="700" letter-spacing="1">HARSHIL BHUVA</text>
  <text x="84" y="177" fill="#00F5D4" font-family="monospace" font-size="15" letter-spacing="2">SECURITY  /  SYSTEMS  /  RESEARCH</text>
  <text x="84" y="203" fill="#94A3B8" font-family="monospace" font-size="13">Observe carefully. Test methodically. Verify the evidence.</text>
  <g clip-path="url(#panel-clip)">
    <rect x="52" y="64" width="720" height="3" fill="url(#scan)" opacity=".9">
      <animate attributeName="y" values="64;219;64" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="825" y="155" fill="#7CFF6B" font-family="monospace" font-size="12" letter-spacing="2">FOCUS AREAS</text>
  <text x="825" y="180" fill="#CBD5E1" font-family="monospace" font-size="14">WEB SECURITY</text>
  <text x="825" y="203" fill="#CBD5E1" font-family="monospace" font-size="14">LINUX + NETWORKS</text>
  <text x="825" y="226" fill="#CBD5E1" font-family="monospace" font-size="14">DETECTION ENGINEERING</text>
  <text x="52" y="276" fill="#64748B" font-family="monospace" font-size="11" letter-spacing="2">CURIOSITY OVER ASSUMPTIONS</text>
  <text x="1148" y="276" text-anchor="end" fill="#00F5D4" font-family="monospace" font-size="11" letter-spacing="2">[ READY TO LEARN ]</text>
</svg>
