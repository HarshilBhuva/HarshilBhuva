<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="82" viewBox="0 0 1200 82" role="img" aria-labelledby="title desc">
  <title id="title">Animated profile footer</title>
  <desc id="desc">Minimal terminal-inspired footer with a flowing cyan and green signal line and blinking prompt cursor.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F5D4" stop-opacity="0"/>
      <stop offset=".45" stop-color="#00F5D4"/>
      <stop offset=".7" stop-color="#7CFF6B"/>
      <stop offset="1" stop-color="#7CFF6B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M0 18H1200" stroke="url(#line)" stroke-width="2" stroke-dasharray="180 1020">
    <animate attributeName="stroke-dashoffset" from="1200" to="0" dur="5s" repeatCount="indefinite"/>
  </path>
  <path d="M40 32h18l8 8h18m1030-8h18l8 8h18" fill="none" stroke="#00F5D4" stroke-opacity=".45" stroke-width="1.5"/>
  <text x="600" y="56" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="12" letter-spacing="3">STAY CURIOUS  /  VERIFY EVERYTHING  /  DOCUMENT THE FINDING</text>
  <rect x="1034" y="43" width="7" height="15" rx="1" fill="#7CFF6B" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
